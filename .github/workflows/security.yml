name: "DevSecOps Security Pipeline"

on:
  push:
    branches: [ "feature/teste-seguranca", "main", "master" ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  security_scans:
    name: Execute Security Linters
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SECRET SCANNING - Gitleaks
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Como a action padrão gera 'results.sarif' mas pode limpá-lo, pegamos se ele persistir
      # ou renomeamos se necessário. Para garantir o envio, focamos nos gerados localmente:

      # 2. SAST - Semgrep OSS
      - name: Run Semgrep OSS Application Code Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=auto --sarif --output=semgrep-results.sarif
        continue-on-error: true

      # 3. SCA - Trivy
      - name: Run Trivy Dependency Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      # 4. CENTRALIZAÇÃO - Upload usando faraday-cli com a sintaxe correta
      - name: Consolidate & Upload SARIF Reports to Faraday Platform
        if: always()
        run: |
          echo "Instalando faraday-cli e enviando relatórios..."
          python3 -m pip install faraday-cli

          # Remove barra no final da URL se houver
          BASE_URL=$(echo "${{ secrets.FARADAY_URL }}" | sed 's/\/$//')

          # Autenticação com os parâmetros corrigidos de acordo com a CLI (-f, -u, -p)
          faraday-cli auth \
            -f "$BASE_URL" \
            -u "faraday" \
            -p "${{ secrets.FARADAY_PASSWORD }}"

          # Garante que os relatórios existem e faz o upload para o workspace criado
          if [ -f results.sarif ]; then
            echo "Importando Gitleaks para o Faraday..."
            faraday-cli tool run "results.sarif" --workspace "${{ secrets.FARADAY_WORKSPACE }}"
          fi

          if [ -f semgrep-results.sarif ]; then
            echo "Importando Semgrep para o Faraday..."
            faraday-cli tool run "semgrep-results.sarif" --workspace "${{ secrets.FARADAY_WORKSPACE }}"
          fi

          if [ -f trivy-results.sarif ]; then
            echo "Importando Trivy para o Faraday..."
            faraday-cli tool run "trivy-results.sarif" --workspace "${{ secrets.FARADAY_WORKSPACE }}"
          fi
