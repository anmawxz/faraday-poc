name: "DevSecOps Security Pipeline"

on:
  push:
    branches: [ "feature/teste-seguranca", "main", "master" ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  security_scans:
    name: Execute Security Linters
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SECRET SCANNING - Gitleaks
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Como a action padrão gera 'results.sarif' mas pode limpá-lo, pegamos se ele persistir
      # ou renomeamos se necessário. Para garantir o envio, focamos nos gerados localmente:

      # 2. SAST - Semgrep OSS
      - name: Run Semgrep OSS Application Code Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=auto --sarif --output=semgrep-results.sarif
        continue-on-error: true

      # 3. SCA - Trivy
      - name: Run Trivy Dependency Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      # 4. CENTRALIZAÇÃO - Upload dos resultados SARIF para o Faraday via API
      - name: Consolidate & Upload SARIF Reports to Faraday Platform
        if: always()
        run: |
          echo "Enviando os relatórios para o painel central do Faraday via API..."
          
          # Remove qualquer barra no final para padronizar a montagem da URL
          BASE_URL=$(echo "${{ secrets.FARADAY_URL }}" | sed 's/\/$//')
          
          # Endpoint dedicado para importação de relatórios de ferramentas (Tool Reports)
          ENDPOINT="/_api/v2/ws/${{ secrets.FARADAY_WORKSPACE }}/tool_report"
          
          # 1. Envio do relatório Gitleaks
          if [ -f results.sarif ]; then
            echo "Enviando resultados do Gitleaks..."
            curl -X POST "${BASE_URL}${ENDPOINT}" \
              -H "Authorization: ${{ secrets.FARADAY_AUTH }}" \
              -H "Accept: application/json" \
              -F "file=@results.sarif"
          fi

          # 2. Envio do relatório Semgrep
          if [ -f semgrep-results.sarif ]; then
            echo "Enviando resultados do Semgrep..."
            curl -X POST "${BASE_URL}${ENDPOINT}" \
              -H "Authorization: ${{ secrets.FARADAY_AUTH }}" \
              -H "Accept: application/json" \
              -F "file=@semgrep-results.sarif"
          fi
          
          # 3. Envio do relatório Trivy
          if [ -f trivy-results.sarif ]; then
            echo "Enviando resultados do Trivy..."
            curl -X POST "${BASE_URL}${ENDPOINT}" \
              -H "Authorization: ${{ secrets.FARADAY_AUTH }}" \
              -H "Accept: application/json" \
              -F "file=@trivy-results.sarif"
          fi
